## Group Spawner

- type: entity
  id: BalanceSpawnXenoHordeRandomized
  name: Drone/Lesser
  placement:
    mode: AlignTileAny
  components:
  - type: Transform
    anchored: false
  - type: Marker
  - type: EntityTableSpawner
    offset: 0.5
    table: !type:NestedSelector
      tableId: XenoHordeCombinations

- type: entityTable
  id: XenoHordeCombinations
  table: !type:GroupSelector
    children:
    - !type:AllSelector
      weight: 1
      children:
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCDrone
    - !type:AllSelector
      weight: 1
      children:
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCDrone
    - !type:AllSelector
      weight: 1
      children:
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCLesserDrone
      - id: BalanceXenoNPCDrone
      - id: BalanceXenoNPCDrone
    - !type:AllSelector
      weight: 1
      children:
      - id: BalanceXenoNPCLesserDrone
