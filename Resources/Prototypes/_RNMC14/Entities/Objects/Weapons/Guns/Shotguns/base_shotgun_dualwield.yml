- type: entity
  abstract: true
  parent: [ BaseItem, CMBaseWeaponGun, RMCBaseAttachableHolder ]
  id: RNMCBaseWeaponShotgunDualWield
  components:
  - type: Item
    size: Large
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
    slots:
    - Back
    - SuitStorage
  - type: Wieldable
  - type: WieldDelay
    baseDelay: 0.6
  - type: WieldableSpeedModifiers
    base: 0.666
    light: 0.921
    medium: 0.865
    heavy: 0.865
  - type: AmmoCounter
  - type: EmitSoundOnLand
    sound:
      collection: RMCRustleGun
      params:
        volume: -4
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 10
    scatterUnwielded: 20
    baseFireRate: 1.429
    burstScatterMult: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCShellShotgun
    capacity: 9
    proto: null
    soundInsert:
      collection: CMShotgunLoad
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: RMCAmmoEject
    containerID: ballistic-ammo
    ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
  - type: StaticPrice
    price: 500
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: Tag
    tags:
    - RNMCWeaponShotgunDualWield
  - type: RMCFireGroup
    group: Shotgun
    delay: 4
  - type: GunPointBlank
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.15
    accuracyMultiplierUnwielded: 0.5
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/shotgun_mouse.rsi
      state: all
  - type: RMCGunChamber
    enabled: false
  - type: Multishot

- type: entity
  abstract: true
  parent: RNMCBaseWeaponShotgunDualWield
  id: RNMCBaseBreechloaderDualWield
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
    layers:
    - state: base
      map: [ "enum.BreechVisuals.Open" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: bolt-open }
          False: { state: base }
  - type: BallisticAmmoProvider
    cycleable: true
    capacity: 2
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/grenade_insert.ogg
      params:
        volume: -2
  - type: UniqueAction
  - type: BreechLoaded
    needOpenClose: false

- type: entity
  parent: [ RNMCBaseBreechloaderDualWield, RMCBaseAttachableHolder ]
  abstract: true
  name: M357 Rival
  id: RNMCBaseWeaponShotgunM357DualWield
  description: A double barrel shotgun produced by AEGIS. Archaic, sturdy, affordable. Only holds two 12g shells at a time.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/doublebarrel.rsi
  - type: Gun
    shotsPerBurst: 2
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun_heavy.ogg
  - type: ShootUseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/doublebarrel.rsi
  - type: BallisticAmmoProvider
    cycleable: true
    whitelist:
      tags:
      - RMCShellShotgun
    capacity: 2
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 10
    scatterUnwielded: 20
    baseFireRate: 0.7
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.15
    accuracyMultiplierUnwielded: 0.5
  - type: Construction
    graph: M357Sawn
    node: start
    deconstructionTarget: null
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-stock:
        startingAttachable: RMCAttachmentDoubleBarrelShotgunStock
        whitelist:
          tags:
          - RMCAttachmentDoubleBarrelShotgunStock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentGyroscopicStabilizer
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, 0.06
      rmc-aslot-rail: -0.025, 0.09
      rmc-aslot-stock: -0.55, -0.05
      rmc-aslot-underbarrel: 0.25, -0.31
  - type: Tag
    tags:
    - RNMCWeaponShotgunM357DualWield
    - RMCWeaponShotgun

- type: Tag
  id: RNMCWeaponShotgunDualWield

- type: Tag
  id: RNMCWeaponShotgunM357DualWield
