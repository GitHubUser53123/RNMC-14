- type: entity
  parent: RMCXenoCrusher
  id: RMCXenoNPCCrusher
  suffix: AI
  components:
  - type: Xeno
    role: CMXenoCrusherNPC
  - type: HTN
    rootTask:
      task: CMXenoCompound
    blackboard:
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        30
      AggroVisionRadius: !type:Single
        30
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
      1100: Dead
  - type: Tag
    tags:
    - FootstepSound
  - type: FootstepModifier
    footstepSoundCollection:
      collection: XenoFootstepLarge
      params:
        volume: -6
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          RNMCXenoGibLarge:
            min: 1
            max: 1
            offset: 0
  - type: AcidBloodSplash
    closeSplashRadius: 0.5
    standardSplashRadius: 1.5
    gibSplashRadius: 2.5
    damage:
      types:
        Heat: 25
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 65

- type: entity
  parent: RMCXenoNPCCrusher
  id: RNMCXenoNPCCrusher
  suffix: CM|AI
  components:
  - type: Sprite
    sprite: _RNMC14/Mobs/XenonidsCM/Crusher/crusher.rsi


# You may be confused.
# Why the funk is there a copy & paste of base_xeno.yml code?
# The answer is that crusher has its ai code a little bit different.
# It picks the entity with highest health instead of the closest one.
- type: htnCompound
  id: CMXenoCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: CMXenoMeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MoveToAliveCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: CMXenoMeleeCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargetsHealth
    - !type:HTNCompoundTask
      task: MeleeAttackTargetCompound